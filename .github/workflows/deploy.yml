name: Deploy
on:
  workflow_dispatch
  #push:
  #  branches:
  #    - homologacao
  #    - producao

jobs:
  deploy-homologacao:
    if: github.ref == 'refs/heads/homologacao'
    runs-on: ubuntu-latest

    steps:
      - name: Testar SSH manual
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      
          ssh -vvv \
            -o StrictHostKeyChecking=no \
            -i ~/.ssh/id_ed25519 \
            univates@${{ secrets.SERVER_HOST }} \
            "echo conectado"
    
