name: Deploy
on:
  push:
    branches:
      - homologacao
      - producao

jobs:
  deploy-homologacao:
    if: github.ref == 'refs/heads/homologacao'
    runs-on: ubuntu-latest
    environment: homologacao
    steps:
      - uses: actions/checkout@v4

      - name: Debug SSH connection
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          # Verifica se a porta está acessível
          nc -zv "$SSH_HOST" 22 || echo "PORTA 22 INACESSÍVEL"
          
          # Verbose SSH para ver onde falha
          ssh -vvv -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              "$SSH_USER"@"$SSH_HOST" 'echo OK' 2>&1 | head -60
            
      # Removemos completamente o ssh-keyscan e qualquer injeção direta de segredos no terminal
      - name: Configurar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      # O bypass do Host Checking é feito aqui, de forma limpa e segura
      - name: Deploy homologacao
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no "$SSH_USER"@"$SSH_HOST" '
            chmod +x /home/univates/gerencia_configuracao/comandos/levantar_homologacao.sh && 
            /home/univates/gerencia_configuracao/comandos/levantar_homologacao.sh
          '
