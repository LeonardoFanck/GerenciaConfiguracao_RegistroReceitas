name: Debug SSH

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    environment: homologacao

    steps:
      - name: Criar chave
        run: |
          cat > key << 'EOF'
          ${{ secrets.SSH_KEY }}
          EOF
          chmod 600 key

      - name: Testar SSH
        run: |
          ssh -vvv \
            -i key \
            -o StrictHostKeyChecking=no \
            univates@177.44.248.36 \
            "whoami"
