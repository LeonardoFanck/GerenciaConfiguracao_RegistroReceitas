name: Homologação Pipeline

on:
  pull_request:
    branches:
      - homologacao

jobs:

  build-test:
    name: Build e Testes Homolog
    
    runs-on: ubuntu-latest

    steps:

      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Instalação SonarQube
        run: dotnet tool install --global dotnet-sonarscanner
        
      - name: Validações SonarQube
        run: |
          dotnet sonarscanner begin \
          /k:"LeonardoFanck_GerenciaConfiguracao_RegistroReceitas" \
          /o:"leonardofanck" \
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
          /d:sonar.cs.opencover.reportsPaths=coverage.xml

      - name: Restaurar dependências
        run: dotnet restore src/RegistroReceitas

      - name: Build projeto
        run: dotnet build src/RegistroReceitas --no-restore

      - name: Executar testes
        run: dotnet test src/RegistroReceitas --no-build
      
      - name: SonarQube Relatório
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
